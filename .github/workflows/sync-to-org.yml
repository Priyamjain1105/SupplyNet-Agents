name: Sync Repo to Organization

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch uses master

jobs:
  sync-to-org:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetches full commit history for a clean push

      - name: Push to Organization Repository
        env:
          ORG_TOKEN: ${{ secrets.ORG_SYNC_TOKEN }}
        run: |
          git remote add org https://github.com/SupplyNet/SupplyNet-Agents.git
          git -c http.extraheader="AUTHORIZATION: bearer $ORG_TOKEN" push org HEAD:main --force